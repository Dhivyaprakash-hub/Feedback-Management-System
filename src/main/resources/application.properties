spring.application.name=feedback-management-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:feedback;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
feedback.submission-key=${FEEDBACK_SUBMISSION_KEY:local-demo-key-change-before-deploy}
feedback.admin-key=${FEEDBACK_ADMIN_KEY:local-admin-key-change-before-deploy}
